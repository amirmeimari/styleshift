<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleShift Settings</title>
    <link rel="icon" type="image/png" href="/icons/dark/icon32.png" />
    <style>
      /* Inherit UI typography without overriding selected font specimens. */
      body {
        font-family: "Inter", "Vazirmatn", system-ui, sans-serif;
      }

      body {
        margin: 0;
        background: #fafaf8;
      }

      /* First-paint ground before React/the stored theme pref can apply the
         `dark` class - matches the majority OS-dark case. */
      @media (prefers-color-scheme: dark) {
        body {
          background: #18191d;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/options/main.tsx"></script>
  </body>
</html>
