<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleShift Settings</title>
    <style>
      * {
        font-family: "Nunito Sans", "Vazirmatn", sans-serif !important;
      }

      body {
        margin: 0;
        background: #e7dac4;
      }

      /* First-paint ground before React/the stored theme pref can apply the
         `dark` class - matches the majority OS-dark case. */
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1714;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/options/main.tsx"></script>
  </body>
</html>
