<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleShift</title>
    <link rel="icon" type="image/png" href="/icons/dark/icon32.png" />
    <style>
      /* Inherit UI typography without overriding selected font specimens. */
      body {
        font-family: "Inter", "Vazirmatn", system-ui, sans-serif;
      }

      html,
      body {
        /* Chrome sizes action popups from intrinsic content. A 100vw cap can
           feed its initial tiny viewport back into the preferred width. */
        width: 420px;
        min-width: 420px;
      }

      body {
        /* Keep the fixed popup frame anchored physically left even when the
           localized app inside it is RTL. The React <main> owns content
           direction; without this frame rule, a wider host viewport can
           right-align and partially clip the 420px popup body. */
        direction: ltr;
        margin: 0;
        background: #fafaf8;
      }

      /* First-paint ground before React/the stored theme pref can apply the
         `dark` class - matches the majority OS-dark case. An explicit choice
         that contradicts the OS still gets one frame of the wrong ground. */
      @media (prefers-color-scheme: dark) {
        body {
          background: #18191d;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
